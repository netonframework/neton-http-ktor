name: Adapter compatibility
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, target: macosArm64 }
          - { os: ubuntu-latest, target: linuxX64 }
          - { os: windows-latest, target: mingwX64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test published dependency compatibility
        shell: bash
        run: ./gradlew --no-daemon -Pneton.local=false ${{ matrix.target }}Test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ matrix.target }}
          path: build/test-results/
  abi:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon -Pneton.local=false checkKotlinAbi
